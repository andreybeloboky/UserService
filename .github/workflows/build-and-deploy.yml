name: SonarQube
on:
  push:
    branches:
      [ "main" , "feature/abjack-1" ]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    permissions:
     contents: read
     packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
         fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Run Tests with Coverage
        run:  mvn -B jacoco:prepare-agent test jacoco:report

      - name: Debug Jacoco XML
        run: ls -l target/site/jacoco

      - name: Analyze with SonarCloud
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Run Integration Tests
        run: mvn -B verify

      - name: Package JAR
        run: mvn package -Dmaven.test.skip=true -Djacoco.skip=true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker image name
        run: echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/user-service" >> $GITHUB_ENV

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
            context: .
            file: ./Dockerfile
            push: true
            tags: |
              ${{ env.IMAGE_NAME }}:latest
              ${{ env.IMAGE_NAME }}:${{ github.sha }}