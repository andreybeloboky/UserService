services:
  mydb:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - mydb_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d mydb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    hostname: redis
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-commander:
    container_name: redis-commander
    hostname: redis-commander
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"

  app:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: user-service
      ports:
        - "8080:8080"
      depends_on:
        mydb:
          condition: service_healthy
        redis:
          condition: service_started
      env_file:
        - .env
      environment:
        - SPRING_PROFILES_ACTIVE=docker
        - SPRING_DATASOURCE_URL=jdbc:postgresql://mydb:5432/mydb
        - SPRING_DATASOURCE_USERNAME=user
        - SPRING_DATASOURCE_PASSWORD=pass
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - APP_JWT_SECRET=x9V4bN7mQ2pL5wR8zK3jH6cF1gT9vD4sY8nB2mX5cZ7vM3kP9lJ4hG1rT6dW8yN2

volumes:
  mydb_data:
  redis_data:
